services:
  opencanon:
    build: .
    image: opencanon:local
    restart: unless-stopped
    ports:
      - "${OPENCANON_PORT:-8088}:8080"
    volumes:
      - opencanon-data:/var/lib/opencanon
    command:
      - -listen=0.0.0.0:8080
      - -printer-config=/app/config/printer.json
      - -data-dir=/var/lib/opencanon
      - -pdfinfo=/usr/bin/pdfinfo
      - -cups-address=${CUPS_ADDRESS:?Set CUPS_ADDRESS to the Mac CUPS IPP address}

volumes:
  opencanon-data:
